name = "applepay-control-plane"
main = "src/index.ts"
compatibility_date = "2023-10-30"

# Serve the Merchant Portal UI static assets
[assets]
directory = "../merchant-portal-ui/dist"
binding = "ASSETS"

[vars]
# Placeholder for environment variables
SHOPIFY_API_KEY = ""
SHOPIFY_API_SECRET = ""
SHOPIFY_API_VERSION = "2024-01"
SHOPIFY_SCOPES = "read_products,read_content"
SHOPIFY_APP_URL = ""
CF_API_TOKEN = ""
CF_ZONE_ID = ""
CF_SAAS_CNAME_TARGET = ""
APPLE_ENV = "production"
APPLE_ENCRYPT_TO = ""
APPLE_USE_JWT = "false"

[kv_namespaces]
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_PREVIEW_KV_ID"

# Optional: D1 database if persisting shop data
[[d1_databases]]
binding = "DB"
database_name = "applepay-db"
database_id = "YOUR_D1_DATABASE_ID"
